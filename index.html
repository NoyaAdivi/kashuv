<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kashuv</title>
  <meta name="description" content="תמלול זומים, עזרה להתרכז וסיכומים מטורפים. חינם ובמחשב שלך.">
  <link rel="icon" href="static/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // apply saved theme and accessibility settings before the first paint
    try {
      const p = JSON.parse(localStorage.getItem('kashuv-prefs') || '{}');
      if (p.theme) document.documentElement.dataset.theme = p.theme;
      for (const k of ['contrast', 'still', 'links', 'plain']) if (p[k]) document.documentElement.classList.add('a11y-' + k);
      if (p.size) document.documentElement.style.setProperty('--scale', p.size);
      if (localStorage.getItem('kashuv-lang') === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <a href="#main" class="skip" data-en="Skip to content">דילוג לתוכן</a>
  <div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="site-head">
    <a href="#/" class="brand" aria-label="Kashuv, דף הבית" data-en-label="Kashuv, home page">
      <img src="static/logo.svg" alt="" width="40" height="40">
      <span>kashuv</span>
    </a>
    <nav aria-label="ניווט ראשי" data-en-label="Main navigation">
      <a href="#/" data-nav="home"><span aria-hidden="true">🏠</span> <span data-en="Home">בית</span></a>
      <a href="#/live" data-nav="live"><span aria-hidden="true">🎧</span> <span data-en="Live">האזנה חיה</span></a>
      <a href="#/library" data-nav="library"><span aria-hidden="true">📚</span> <span data-en="My summaries">הסיכומים שלי</span></a>
    </nav>
    <button class="icon-btn" id="lang-btn" type="button" aria-label="עברית / English" style="font-weight:700;font-size:.9rem">EN</button>
    <button class="icon-btn" id="theme" type="button" aria-label="החלפת מצב כהה ובהיר" data-en-label="Toggle dark mode">🌙</button>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="site-foot">
    <div class="foot-brand"><img src="static/logo.svg" alt="" width="28" height="28"> kashuv</div>
    <p class="foot-note" data-en="Everything runs on your computer. No recording is uploaded. Tell participants you are recording.">הכל רץ במחשב שלך. שום הקלטה לא עולה לאינטרנט. ספרי למשתתפים שאת מקליטה.</p>
    <a class="foot-link" href="#/accessibility" data-en="♿ Accessibility statement">♿ הצהרת נגישות</a>
    <p class="foot-credit">
      <span data-en="Built by">נבנה על ידי</span>
      <a class="foot-name" href="https://www.linkedin.com/in/noya-adivi" target="_blank" rel="noopener noreferrer" aria-label="נויה בלינקדאין" data-en-label="Noya on LinkedIn">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"/></svg>
        <span data-en="Noya">נויה</span>
      </a>
    </p>
  </footer>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <button id="a11y-btn" class="a11y-btn" type="button" aria-label="תפריט נגישות (אפשר לגרור)" data-en-label="Accessibility menu (draggable)" aria-expanded="false" aria-controls="a11y-panel">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm8 6.5-5.5 1V22h-2v-6h-1v6h-2V9.5L4 8.5l.4-2 7.6 1.4 7.6-1.4.4 2Z"/></svg>
  </button>
  <div id="a11y-panel" class="a11y-panel" role="dialog" aria-label="הגדרות נגישות" data-en-label="Accessibility settings" hidden>
    <h2 data-en="Accessibility">נגישות</h2>
    <div class="a11y-size">
      <span data-en="Text size">גודל טקסט</span>
      <button type="button" data-a11y="smaller" aria-label="הקטנת טקסט" data-en-label="Smaller text" data-en="A-">א-</button>
      <button type="button" data-a11y="bigger" aria-label="הגדלת טקסט" data-en-label="Bigger text" data-en="A+">א+</button>
    </div>
    <button type="button" data-a11y="contrast" data-en="◐ High contrast">◐ ניגודיות גבוהה</button>
    <button type="button" data-a11y="still" data-en="⏸ Stop animations">⏸ עצירת אנימציות</button>
    <button type="button" data-a11y="links" data-en="🔗 Highlight links">🔗 הדגשת קישורים</button>
    <button type="button" data-a11y="plain" data-en="🔤 Simple font">🔤 גופן פשוט</button>
    <button type="button" data-a11y="reset" class="ghost" data-en="Reset">איפוס</button>
    <a href="#/accessibility" class="a11y-link" data-en="Accessibility statement">הצהרת נגישות</a>
    <p class="a11y-hint" data-en="Tip: drag the button or move it with the arrow keys">טיפ: אפשר לגרור את הכפתור או להזיז אותו עם החצים</p>
  </div>

  <!-- GitHub Pages demo: sample data, no server. The real app is served by app.py from templates/index.html -->
  <script>window.KASHUV_DEMO = true;</script>
  <script src="static/demo-data.js"></script>
  <script src="static/a11y.js"></script>
  <script src="static/app.js"></script>
</body>
</html>
