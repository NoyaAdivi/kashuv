<linearGradient id="kg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC6B5"/><stop offset="1" stop-color="#C9BEFF"/></linearGradient>
<clipPath id="c"><rect width="1200" height="150" rx="28"/></clipPath><path id="s" d="M0-14C2-4 4-2 14 0 4 2 2 4 0 14-2 4-4 2-14 0-4-2-2-4 0-14Z"/></defs><style>
.blob{animation:drift 11s ease-in-out infinite alternate}.b2{animation-duration:14s;animation-direction:alternate-reverse}.b3{animation-duration:17s}
.bob{animation:bob 3.4s ease-in-out infinite}.d1{animation-delay:-.9s}.d2{animation-delay:-1.8s}.d3{animation-delay:-2.6s}
.tw{animation:tw 3.2s ease-in-out infinite}.t2{animation-delay:-1s}.t3{animation-delay:-2s}
.rise{animation:rise .9s ease-out both}.r2{animation-delay:.2s}
.wv{transform-box:fill-box;transform-origin:center;animation:wv 1.2s ease-in-out infinite}
.w1{animation-delay:-.2s}.w2{animation-delay:-.5s}.w3{animation-delay:-.8s}.w4{animation-delay:-1s}
.ln{animation:ln 6s ease-in-out infinite both}.l2{animation-delay:.6s}.l3{animation-delay:1.2s}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
@keyframes drift{to{transform:translate(40px,-20px) scale(1.12)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes wv{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes ln{0%{opacity:0;transform:translateX(14px)}12%,85%{opacity:1;transform:none}100%{opacity:0}}
